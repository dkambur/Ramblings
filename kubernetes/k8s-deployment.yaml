---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramblings-app
  namespace: ramblings
  labels:
    app: ramblings-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ramblings-app
  template:
    metadata:
      labels:
        app: ramblings-app
    spec:
      containers:
        - name: ramblings-app
          image: ghcr.io/$IMAGE_NAME:$IMAGE_TAG
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /deck-api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /deck-api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: api-docs-sidecar
          image: nginx:latest
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: api-docs
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: api-docs
          configMap:
            name: api-docs

---
apiVersion: v1
kind: Service
metadata:
  name: ramblings-app
  namespace: ramblings
spec:
  type: NodePort
  selector:
    app: ramblings-app
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: api-docs
      protocol: TCP
      port: 80
      targetPort: 80